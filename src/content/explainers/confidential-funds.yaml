title: "Confidential Funds"
subtitle: "Behind the public's naked eye"
category: "Accountability"
description: "What confidential funds are, the disclosure law that was never written, and how ₱612.5 million left Land Bank in cash across seven cheques."
publishedAt: 2026-08-07
author: "Sir Jairus Macabuhay"
leadParagraph: "Seven cheques moved ₱612.5 million in cash out of Land Bank between December 2022 and July 2023: ₱500 million from the Office of the Vice President, ₱112.5 million from the Department of Education. That total is the sum named in Impeachment Article 1."

drivers:
  - heading: "What are 'confidential' funds?"
    body: |
      A lump sum in the national budget for expenses the government says it cannot disclose. This covers buying information, surveillance transport, safehouses, and informant rewards.

      It is not the same as an intelligence fund.
    table:
      columns:
        - "Confidential fund"
        - "Intelligence fund"
      rows:
        - label: "Who holds it"
          cells:
            - "Civilian government agencies"
            - "Uniformed and military personnel, intelligence practitioners"
        - label: "What's it for"
          cells:
            - "Surveillance supporting that agency's mandate"
            - "Intelligence-gathering with direct impact on national security"
        - label: "Spent in 2023"
          cells:
            - "₱4.415 billion"
            - "₱6.028 billion"
    sourceNote: "Sources: COA–DBM–DILG–GCG–DND Joint Circular No. 2015-01 · COA 2023 spending data"

  - heading: "Why do they even exist?"
    body: |
      Because some spending genuinely cannot carry a paper trail.

      The circular permits these funds for purchasing information, maintaining safehouses, and paying informants who are not government employees.

      You cannot file a receipt that tells a surveillance target they are being watched.
    sourceNote: "Source: Permitted uses under Joint Circular No. 2015-01"

  - heading: "Not every agency is allowed one"
    body: |
      The circular limits these funds to activities concerning peace and order and national security.

      They may not be spent on:
    bullets:
      - "Salaries, wages, overtime, allowances or other fringe benefits of government officials and employees, except when authorized by law"
      - "Representation, consultancy fees or entertainment expenses"
      - "Construction or acquisition of buildings or housing structures"
    coda: "And who approves the spending? The agency head."
    sourceNote: "Source: Joint Circular No. 2015-01, Sec. 4.11 and Sec. 6.1.2"

  - heading: "The missing law"
    body: |
      The Constitution requires the State to disclose transactions involving public interest, "subject to reasonable conditions prescribed by law."

      That law was never written.

      Everything above comes from a circular signed by agency heads in 2015, not a statute passed by Congress.

      In November 2023, retired Justice Antonio Carpio petitioned the Supreme Court to void the circular.
    sourceNote: "Sources: 1987 Constitution, Art. II Sec. 28 and Art. III Sec. 7 · Carpio et al. petition, filed Nov. 15, 2023, via Rappler"

  - heading: "How the money moves"
    body: |
      The money is drawn as cash advances and liquidated with acknowledgment receipts, a signature saying money was received.

      Within seven days of the cheque being released, the cash advance voucher goes to COA's audit team leader in a sealed envelope. Liquidation is separate and slower: due within 30 days after every quarter, and sent not to the regular auditors but to a single body, the Intelligence and Confidential Fund Audit Unit, by registered mail, courier or authorized liaison officer.

      ICFAU staff open the envelope in front of whoever delivered it and check that every document named on the transmittal letter is actually inside. If anything is missing, it is not stamped received and goes back sealed.

      That completeness check is the part the public can picture. What follows is a post-audit conducted by that one unit, on records nobody else sees. For intelligence funds, COA does not even receive the evidence. It stays in a sealed envelope in the disbursing officer's own vault, inspected only if ICFAU demands it.
    sourceNote: "Sources: Joint Circular No. 2015-01, Secs. 4.12–4.13, 6.1.8.4 and 6.2.2 · former COA Commissioner Heidi Mendoza, via Rappler"

  - heading: "Why did the Department of Education have surveillance money?"
    body: |
      In its entire history, DepEd had never received confidential funds. That changed in 2023.

      A COA auditor testified that he served at the Intelligence and Confidential Funds Audit Office from 2014 to 2024. Three vice presidents held office in that time: Binay, Robredo, Duterte.

      Duterte was Vice President and Education Secretary at once, making her the agency head for both offices holding the money.
    sourceNote: "Source: Testimony of former COA-ICFAO state auditor Roderick Wamil, Senate impeachment court, Aug. 3, 2026, via Philippine News Agency and The Manila Times"

  - heading: "Seven cheques. ₱612.5 million in cash."
    body: |
      Two former Land Bank branch managers testified on July 29 about how the money left the bank.

      Office of the Vice President: ₱500 million. Four cheques of ₱125 million each, December 2022 to July 2023, encashed by special disbursing officer Gina Acosta.

      DepEd: ₱112.5 million. Three cheques of ₱37.5 million each, February to July 2023, encashed by special disbursing officer Edward Fajarda.

      In 2024, Congress cut both offices' confidential funds to zero.

      ACT Teachers Rep. France Castro said it turned the education department into "a department of surveillance."

      DepEd's own finance office later said it did not know how the money was spent.
    sourceNote: "Sources: Rappler · Inquirer · GMA News · Philstar · VERA Files, 2022–2024 reporting"

  - heading: "COA findings"
    body: |
      COA counted more than 1,200 deficient acknowledgment receipts filed by the OVP, carrying wrong dates, unreadable names, and in some cases nothing but a signature.

      One payee, "Mary Grace Piattos," does not exist.

      Across its findings, COA has ordered ₱448 million returned. The Vice President is named jointly with three other officials.

      One notice inside that total covers ₱73 million of the ₱125 million the OVP disbursed in 2022. COA issued it because the documents filed were not enough to show how the money was spent, and because the spending fell outside the purposes the 2015 circular allows.

      A disallowance is a finding, not a conviction. It can be appealed, and the auditor testified that the ₱73-million order is final unless the Supreme Court issues a temporary restraining order.
    sourceNote: "Sources: COA notices of disallowance · testimony of Roderick Wamil, Aug. 5, 2026, via GMA News"

  - heading: "The defense"
    body: ""
    table:
      columns:
        - "The defense says"
        - "The record shows"
      rows:
        - cells:
            - "\"Codenames aren't prohibited.\""
            - "Correct, and it came from the prosecution's own witness. It settles how payees are named, not the missing documents."
        - cells:
            - "\"It was legally appropriated. The Cabinet approved it.\""
            - "True, but COA is not questioning the release. It is questioning what followed."
        - cells:
            - "\"A delayed release, not a spending spree.\""
            - "Funds arrived Dec. 20, leaving eleven days in the year. That explains the window, but not 111 disbursements in one day."
        - cells:
            - "\"Congress restored DepEd's allocation.\""
            - "True, the bicam put back all ₱150 million. That settles whether the office may hold it, not how it is spent."
    coda: "Refusing to stipulate receipts and opposing judicial notice are due-process positions, not evidence of anything."
    sourceNote: "Sources: Defense counsel Sheila Sison, Michael Poa and Kristine Ferrer · testimony of Roderick Wamil, Aug. 3–5, 2026, via GMA News, Rappler and Daily Tribune"

