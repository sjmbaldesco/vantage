title: "Charter Change"
subtitle: "Is the Philippines ready?"
category: "Government & Politics"
description: "How the 1987 Constitution can be changed, why no attempt has ever reached a ratification plebiscite, and what each route would cost."
image: "/explainers/charter-change.jpg"
publishedAt: 2026-07-27
author: "Sir Jairus Macabuhay"
leadParagraph: "Charter Change is any effort to amend or revise the 1987 Constitution, and Article XVII opens three doors to it. Nothing takes effect until a majority of Filipinos ratify it in a plebiscite. In 39 years, no attempt has ever made it that far."

drivers:
  - heading: "The three doors"
    body: |
      Article XVII sets out three routes, and each has its own threshold.

      Congress can convene as a constituent assembly, which requires a vote of three-fourths of all its members. It can call a constitutional convention by a two-thirds vote. Or citizens can mount a people's initiative, which needs the signatures of 12% of registered voters nationwide, with at least 3% from every legislative district.

      Whichever door is used, the proposal still has to survive a plebiscite, held 60 to 90 days after it is approved.

  - heading: "Looking back"
    body: |
      The charter was drafted in the year after a dictatorship fell, by people who had lived under it, and much of it reads as a list of things that must never happen again. One six-year presidential term with no reelection. A restored bicameral Congress. A judiciary explicitly empowered to strike down "grave abuse of discretion" by any branch of government.

      It also built walls. Article XII caps foreign ownership of land, natural resources, and core public utilities at 40%. Article XVI closes mass media to foreign ownership entirely. Those provisions were written before the internet reached the Philippines.

  - heading: "The clause that never became law"
    body: |
      Article II, Section 26 states that the government "shall prohibit political dynasties as may be defined by law."

      Congress has never passed that law. The Supreme Court has ruled the provision is not self-executing, so without an enabling statute it does nothing at all.

      Roughly 70% of House members and 80% of senators come from political families. The party-list system, created to seat the marginalized, is now a documented route into Congress for the very families it was written to keep out.
    stats:
      - value: "70%"
        label: "of House members"
        note: "Come from political families, on published estimates."
      - value: "80%"
        label: "of senators"
        note: "Come from political families — the same families the party-list system was created to keep out of Congress."

  - heading: "The Philippines has done this before"
    body: |
      In 1973, a constitutional convention produced a draft. The promised plebiscite was called off four days out. Marcos Sr. replaced it with "citizens' assemblies," where residents 15 and older voted by show of hands, then proclaimed that 95% had approved. In Javellana v. Executive Secretary, the Supreme Court let it stand.

      That charter is what gave martial law its legal clothing.

      The name is on both sides of the question again. The 2024 economic amendments carried the sitting president's endorsement, and the 2026 term-extension allegations came from his sister. His palace denied them.
    stats:
      - value: "95%"
        label: "claimed approval"
        note: "The result Marcos Sr. proclaimed from the 1973 show-of-hands 'citizens' assemblies,' after the promised plebiscite was called off four days out."

  - heading: "Recent attempts"
    body: |
      In January 2024, a people's initiative drive collected signatures nationwide. Senate hearings produced witnesses who said they had been offered social aid, or at least ₱4,000, for a signature. PIRMA's lead convenor admitted coordinating with the Speaker. The Senate rejected the drive unanimously.

      In Santiago (1997) and again in Lambino (2006), the Supreme Court held that no adequate enabling law exists for a constitutional people's initiative, and that the route is limited to amendments, never a full revision.

      Resolution of Both Houses 7 cleared the House on third reading and died in the Senate. In August 2024, RBH 8 was filed to extend House terms to five years, and it died in committee.

  - heading: "Pros: rules that can finally be enforced"
    body: |
      Ordinary law cannot touch the 40% foreign ownership caps, the media ban, or the anti-dynasty clause Congress has left dead since 1987. Only an amendment reaches them. The cost of leaving them stands in the investment figures. The Philippines drew $9 billion in foreign direct investment in 2025, down 4% on the year and sixth in Southeast Asia, against Vietnam's $20.35 billion and Singapore's $150.9 billion.

  - heading: "Cons: whoever holds the pen writes their own rules"
    body: |
      Under a constituent assembly, the people rewriting the Constitution are the people it governs, and most of them come from the political families the charter was supposed to constrain. The last signature drive ended in testimony about ₱4,000 payments. And the 2022 reform laws already opened telecoms, shipping, railways, and retail without touching the charter at all.

