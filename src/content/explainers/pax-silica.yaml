title: "Pax Silica"
subtitle: "What the Philippines is actually signing"
category: "Economy"
description: "The US-led chip and AI coalition the Philippines joined in April 2026, the hub planned for New Clark City, and the water, power and land questions still unanswered."
publishedAt: 2026-07-25
author: "Sir Jairus Macabuhay"
leadParagraph: "The Philippines signed on to Pax Silica in April 2026, one of only two Southeast Asian countries in the coalition. The hub it agreed to host in New Clark City would span around 4,000 acres, nearly five times the size of New York's Central Park."

drivers:
  - heading: "What it is"
    body: |
      A U.S. State Department initiative announced in December 2025 to secure supply chains for semiconductors, AI, and advanced tech. The Philippines signed on in April 2026 as roughly the 13th member, alongside Singapore.

      The coalition was formed to counter China's dominance in chip manufacturing and rare earths. China is reported to control 90% of rare earth refining. The declaration itself names "coercive dependencies" as the thing it is reducing.

  - heading: "The site"
    body: |
      Manila and Washington want to sign the framework agreement governing the hub by November. BCDA puts the industrial estate at about 1,620 hectares, roughly 4,000 acres, inside the 9,450-hectare New Clark City in Tarlac.

      The governing law has not been published, four months out from the signing date.

  - heading: "Water and power"
    body: |
      The Sacobia watershed, New Clark City's main water source, has reportedly shown strain since 2020. One published estimate puts a single 1-gigawatt data center at roughly 15 billion liters a year, about twice New Clark City's total demand. The Makabayan bloc warns of the highest power rates in Asia.

  - heading: "Who is already there"
    body: |
      A 2019 Senate estimate put 15,000 farmers and 20,000 Aeta and Abelling people in the path of New Clark City. No one has published a household count for the Pax Silica parcel.

  - heading: "Pros"
    body: |
      BCDA has put the jobs figure at up to 190,000 direct jobs, and separately at more than 130,000 it calls high-quality roles. It projects $200 billion in exports at full build, between $40 billion and $70 billion in investment, ₱68 billion to ₱75 billion a year in withholding tax, and ₱60 billion in lease income over 25 years.

      BCDA president and chief executive Joshua Bingcang frames the hub as "brain gain" instead of brain drain, keeping Filipino engineers, researchers and computer science graduates working in the country.

      The sector has stagnated at assembly and packaging for decades. Negotiated well, this is a mechanism to break that.

  - heading: "Cons"
    body: |
      Expressions of corporate interest are not binding investments, and projected jobs are not employees. The water and power the project needs are resources the region does not have. Land claims are unresolved and no household count has been published.

      Makabayan argues it subordinates the country to US war production while raising the risk of Chinese trade retaliation.

